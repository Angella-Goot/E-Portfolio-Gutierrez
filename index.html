<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angella Gutierrez</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://kit.fontawesome.com/117076c63f.js" crossorigin="anonymous"></script>
</head>
<body>
    <section id="landing-page">
        <nav>
            <figure>
                <img src="assets/AG-logo.png" alt="Logo" id="nav__logo">
            </figure>
            <ul class="nav__link--list">
                <li class="nav__link">
                  <a href="#" class="  //link contact pop-up when created
                    nav__link--anchor 
                    link__hover-effect 
                    link__hover-effect--black
                  ">About</a>
                </li>
                <li class="nav__link">
                  <a href="#projects" class="
                    nav__link--anchor 
                    link__hover-effect 
                    link__hover-effect--black
                  ">Projects</a>
                </li>
                <li class="nav__link">
                  <a href="#" class="  //link contact pop-up when created
                    nav__link--anchor 
                    link__hover-effect 
                    link__hover-effect--black
                  ">Contact</a>
                </li>
                <li class="nav__link click">
                  <a href="#" class="  //link contact pop-up when created
                    nav__link--anchor 
                    link__hover-effect 
                    link__hover-effect--black
                  "><i class="fa-solid fa-circle-half-stroke"></i></a>
                </li>
            </ul>
        </nav>
        <header>
          <div class="header-content">
            <h1 class="title">Hey</h1>
            <h1 class="title pink">I'm Angella.</h1>
            <p class="header__para">I'm a <b class="pink">Junior Frontend Software Engineer</b> 
               with a passion for creating engaging user experiences. I strive to create solutions 
               that are both functional and delightful, ensuring positive outcomes for all users. 
               <br> Here's more <b class="pink">about me.</b></p>
          </div>
          <div class="social__list">
            <a href="#" target="_blank" class="social__link click">
              <i class="fa-brands fa-linkedin-in"></i>
            </a>
            <a href="#" target="_blank" class="social__link click">
              <i class="fa-brands fa-github"></i>
            </a>
            <a href="#" target="_blank" class="social__link click">
              <i class="fa-regular fa-file-pdf"></i>
            </a>
          </div>
        </header>
        <button class="mail__btn click">
          <i class="fa-solid fa-envelope"></i>
        </button>
        <a href="#projects" class="scroll">
          <div class="scroll__icon click"></div>
        </a>
    </section>
</body>
</html>
